<title>Sprout</title>
<style>
:root{
  --bg:#F7F3EA;--card:#FFFFFF;--ink:#2E3A2F;--mute:#7B857A;--line:#ECE6D8;
  --sage:#6E9F6A;--sage-ink:#FFFFFF;--sage-soft:#E6F0E1;
  --carrot:#EE8A45;--carrot-soft:#FCEADB;--gold:#E9B949;
  --soil:#C29A72;--soil-dark:#A27A55;--water:#6FAED6;
  --r:22px;--shadow:0 1px 2px rgba(46,58,47,.05),0 6px 18px rgba(46,58,47,.06);
  --font:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B1F1B;--card:#252B25;--ink:#EDEFE8;--mute:#9AA396;--line:#333A32;
  --sage:#86B882;--sage-ink:#16200F;--sage-soft:#2C3829;
  --carrot:#F09A5C;--carrot-soft:#3D2F24;--soil:#6E5440;--soil-dark:#5A4433;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
.hide{display:none!important}

/* ---------- layout ---------- */
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 18px}
.head h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.4px}
.head p{margin:4px 0 0;color:var(--mute);font-size:15px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:0 0 12px;font-weight:600}
.muted{color:var(--mute)}
.small{font-size:14px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:16px;font-weight:600;font-size:16px;background:var(--sage-soft);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sage);color:var(--sage-ink)}
.btn.carrot{background:var(--carrot);color:#fff}
.btn.ghost{background:transparent;color:var(--mute);font-weight:500}
.btn.big{min-height:64px;font-size:20px;border-radius:20px;width:100%}
.btn.full{width:100%}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ---------- today ---------- */
.start-card{background:linear-gradient(160deg,var(--sage) 0%,#5D8C5A 100%);color:#fff;padding:22px}
@media (prefers-color-scheme:dark){.start-card{background:linear-gradient(160deg,#3F6A3C 0%,#2F522D 100%)}}
.start-card h3{margin:0 0 4px;font-size:22px}
.start-card p{margin:0 0 18px;opacity:.88;font-size:15px}
.start-card .btn{background:rgba(255,255,255,.95);color:#2F4A2D}
.start-card .btn.soft{white-space:nowrap;background:rgba(255,255,255,.18);color:#fff;font-size:15px;min-height:46px}
.start-card .row{margin-top:10px}
.dl{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dl:first-of-type{border-top:0;padding-top:0}
.dl .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.pill{flex:none;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--sage-soft);white-space:nowrap}
.pill.soon{background:var(--carrot-soft);color:var(--carrot)}
.week{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute);flex:1}
.wd i{width:26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.wd.on i{background:var(--sage);color:#fff}
.wd.today span{color:var(--ink);font-weight:700}
.stat{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.stat b{font-size:28px}
.peek{display:flex;align-items:center;gap:14px}
.peek .em{font-size:38px;line-height:1}
.peek .tx{flex:1}
.peek .tx b{display:block;font-size:17px}

/* ---------- chores ---------- */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:15px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--sage-soft);color:var(--ink)}
.seg-label{font-size:13px;color:var(--mute);margin:0 4px 8px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.routine{display:flex;align-items:center;gap:14px}
.routine .ic{width:52px;height:52px;border-radius:16px;background:var(--carrot-soft);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.routine .tx{flex:1;min-width:0}
.routine .tx b{display:block;font-size:17px}
.routine .tx span{font-size:14px;color:var(--mute)}
.routine .go{flex:none;min-height:42px;padding:0 16px;border-radius:14px;background:var(--sage);color:var(--sage-ink);font-weight:600}
.routine .ed{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.routine .ed svg{width:18px;height:18px}

/* ---------- tasks ---------- */
.add{display:flex;gap:8px;align-items:center}
.add input[type=text]{flex:1;min-width:0;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;outline:none}
.add input[type=text]:focus{border-color:var(--sage)}
.add .plus{width:50px;height:50px;border-radius:14px;background:var(--sage);color:var(--sage-ink);font-size:26px;flex:none;display:flex;align-items:center;justify-content:center}
.opts{display:flex;gap:8px;margin-top:10px;align-items:center}
.opts input[type=date]{flex:1;min-width:0;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;-webkit-appearance:none;appearance:none;font-size:15px}
.sz{display:flex;background:var(--bg);border-radius:12px;padding:3px;border:1.5px solid var(--line);flex:none}
.sz button{width:38px;height:31px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute)}
.sz button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.grp{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:20px 4px 8px;font-weight:600}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--sage);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:16px;transition:.15s}
.chk.done{background:var(--sage);color:#fff}
.task .t{flex:1;min-width:0;font-size:16px;text-align:left;line-height:1.3}
.task.done .t{text-decoration:line-through;color:var(--mute)}
.task .mv{flex:none;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--carrot-soft);color:var(--carrot)}
.empty{text-align:center;color:var(--mute);padding:28px 10px;font-size:15px}
.empty .em{font-size:40px;display:block;margin-bottom:8px}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}

/* ---------- garden ---------- */
.bal{display:flex;gap:10px;margin-bottom:14px}
.bal>div{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.bal b{font-size:22px}
.bal span{font-size:13px;color:var(--mute);display:block}
.bed{background:linear-gradient(180deg,#9CC48E 0%,#86B37A 100%);border-radius:26px;padding:14px;box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){.bed{background:linear-gradient(180deg,#3D5B37 0%,#33502E 100%)}}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plot{aspect-ratio:1;border-radius:18px;background:var(--soil);box-shadow:inset 0 -6px 0 var(--soil-dark);position:relative;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.plot:active{transform:scale(.94)}
.plot .face{font-size:40px;line-height:1;margin-top:-8px}
.plot.empty .plus{font-size:28px;color:rgba(255,255,255,.75);font-weight:300;margin-top:-6px}
.plot .seed{display:block;width:12px;height:8px;border-radius:50%;background:var(--soil-dark);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.plot .pbar{position:absolute;left:14%;right:14%;bottom:14px;height:5px;border-radius:5px;background:rgba(0,0,0,.18);overflow:hidden}
.plot .pbar i{display:block;height:100%;background:var(--water);border-radius:5px;transition:width .4s}
.plot.ready{box-shadow:inset 0 -6px 0 var(--soil-dark),0 0 0 3px var(--gold)}
.plot.ready .face{animation:bob 1.6s ease-in-out infinite}
.plot.ready .pbar{display:none}
.plot.ready::after{content:"tap to pick";position:absolute;bottom:8px;font-size:11px;font-weight:600;color:#fff;opacity:.9}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.plot.splash .face{animation:wiggle .45s ease}
@keyframes wiggle{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(1)}}
.hint{font-size:14px;color:var(--mute);text-align:center;margin:12px 6px 18px;line-height:1.45}
.basket{display:flex;flex-wrap:wrap;gap:8px}
.basket span{background:var(--bg);border-radius:12px;padding:6px 10px;font-size:15px;font-weight:600}
.rw{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rw:first-of-type{border-top:0;padding-top:0}
.rw .t{flex:1;min-width:0;font-size:16px}
.rw .c{font-size:14px;color:var(--mute);flex:none}
.rw .btn{min-height:38px;padding:0 12px;font-size:14px;border-radius:12px;flex:none}
.rw .x{flex:none;width:28px;height:28px;color:var(--mute);font-size:16px}

/* ---------- focus mode ---------- */
.focus{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 18px);animation:fade .25s ease}
.f-top{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.f-title{font-weight:600;color:var(--mute);font-size:15px;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-dots{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap;justify-content:center;max-width:320px}
.f-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.f-dots i.d{background:var(--sage)}
.f-dots i.c{background:var(--carrot);transform:scale(1.3)}
.f-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:520px;gap:18px}
.f-step-n{font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
.f-step{font-size:28px;font-weight:700;text-align:center;line-height:1.25;letter-spacing:-.3px;min-height:2.5em;display:flex;align-items:center}
.f-step.in{animation:stepIn .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes stepIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.f-timer{position:relative;width:min(56vw,210px);aspect-ratio:1}
.f-timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.t-bg{fill:none;stroke:var(--line);stroke-width:14}
.t-fg{fill:none;stroke:var(--carrot);stroke-width:14;stroke-linecap:round;stroke-dasharray:552.92;transition:stroke-dashoffset .3s linear}
.t-fg.over{stroke:var(--sage)}
.t-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-txt b{font-size:38px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.t-txt span{font-size:13px;color:var(--mute);margin-top:2px}
.f-banner{background:var(--sage-soft);border-radius:18px;padding:14px 16px;text-align:center;font-size:15px;line-height:1.4;width:100%}
.f-banner button{display:block;margin:10px auto 0;font-weight:600;color:var(--sage)}
.f-actions{width:100%;max-width:520px}
.f-row{display:flex;justify-content:space-between;margin-top:6px}
.f-row .btn{flex:1;font-size:15px}

/* ---------- tidy sort game ---------- */
.sort{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px);animation:fade .25s ease;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.s-sub{font-size:14px;color:var(--mute);margin-top:10px;text-align:center}
.s-prog{width:100%;max-width:520px;height:6px;border-radius:6px;background:var(--line);margin-top:12px;overflow:hidden}
.s-prog i{display:block;height:100%;width:0;background:var(--sage);border-radius:6px;transition:width .35s ease}
.pile{position:relative;flex:1;width:100%;max-width:520px;margin:14px 0;border-radius:26px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.sitem{position:absolute;width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1;touch-action:none;cursor:grab;transition:transform .32s cubic-bezier(.2,.9,.3,1.1),opacity .32s;will-change:transform;animation:drop .45s cubic-bezier(.2,.9,.3,1.3) backwards}
@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.6)}}
.sitem.drag{transition:none;z-index:5;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.sitem.sel{filter:drop-shadow(0 0 0 transparent);background:var(--sage-soft);border-radius:20px}
.baskets{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:10px;width:100%;max-width:520px}
.baskets.many .basket-t{min-height:68px}
.baskets.many .bk{display:none}
.basket-t .sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.basket-t .nm{font-size:12px;font-weight:700;color:var(--ink);opacity:.75}
.s-stars{min-width:64px;text-align:right;font-size:18px;letter-spacing:1px;color:var(--gold);flex:none}
.s-stars .off{color:var(--line)}
.lv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.lv{background:var(--card);border-radius:16px;padding:10px 4px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px}
.lv b{font-size:20px}
.lv span{font-size:11px;color:var(--gold);letter-spacing:1px}
.lv i{font-style:normal;font-size:12px;color:var(--mute)}
.lv.cur{box-shadow:0 0 0 2.5px var(--sage)}
.win-stars{font-size:44px;letter-spacing:6px;color:var(--gold);margin:4px 0 6px}
.win-stars .off{color:var(--line)}
.basket-t{flex:1;min-height:92px;border-radius:22px;background:var(--carrot-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;transition:transform .15s,background .2s}
.basket-t .tag{font-size:30px;line-height:1}
.basket-t .bk{font-size:24px;line-height:1;opacity:.85}
.basket-t .n{position:absolute;top:6px;right:8px;min-width:20px;height:20px;border-radius:10px;background:var(--card);font-size:12px;font-weight:700;line-height:20px;text-align:center;padding:0 5px}
.basket-t.hot{background:var(--sage-soft);transform:scale(1.05)}
.basket-t.yum{animation:yum .4s ease}
@keyframes yum{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.basket-t.nope{animation:nope .35s ease}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.play-card{display:flex;align-items:center;gap:14px}
.play-card .em{font-size:38px;line-height:1}
.play-card .tx{flex:1;min-width:0}
.play-card .tx b{display:block;font-size:17px}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,25,20,.35);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font-size:22px}
.sheet p{margin:0 0 16px;color:var(--mute);line-height:1.45}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 4px 6px;text-transform:uppercase;letter-spacing:.6px}
.field input,.field textarea{width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus{border-color:var(--sage)}
.field textarea{min-height:180px;line-height:1.5;resize:vertical}
.crops{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.crop{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;gap:12px;align-items:center}
.crop .em{font-size:34px;line-height:1}
.crop b{display:block;font-size:16px}
.crop span{font-size:13px;color:var(--mute)}
.crop.locked{opacity:.45}
.done-hero{text-align:center;padding:10px 0 4px}
.done-hero .em{font-size:64px;display:block;animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.done-hero h3{font-size:26px;margin:10px 0 6px}
.list-set .lr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:16px}
.list-set .lr:first-child{border-top:0}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--sage)}
.switch.on::after{left:23px}
.about{text-align:center;font-size:13px;color:var(--mute);line-height:1.6;margin-top:18px}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mute)}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--sage)}
.tabs .badge{position:absolute;margin-left:22px;margin-top:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--carrot);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.tabs .ti{position:relative;display:flex}

/* ---------- fx ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.on{transform:translate(-50%,0)}
.floaty{position:fixed;z-index:85;pointer-events:none;font-weight:700;font-size:22px;animation:floatUp 1.1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-80%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
</style>
</head>
<body>

<main>
  <!-- TODAY -->
  <section class="view on" id="v-today"></section>
  <!-- CHORES -->
  <section class="view" id="v-chores"></section>
  <!-- TASKS -->
  <section class="view" id="v-tasks"></section>
  <!-- GARDEN -->
  <section class="view" id="v-garden"></section>
</main>

<nav class="tabs"><div class="in">
  <button data-tab="today" class="on"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Today</button>
  <button data-tab="chores"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></span>Chores</button>
  <button data-tab="tasks"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg></span>Tasks</button>
  <button data-tab="garden"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 8-8 7z"/><path d="M12 14c0-3-2.5-5.5-7-5.5 0 4 2.5 6 7 5.5z"/></svg><i class="badge hide" id="gBadge"></i></span>Garden</button>
</div></nav>

<!-- FOCUS MODE -->
<div class="focus hide" id="focus">
  <div class="f-top">
    <button class="icon-btn" data-act="fstop" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="f-title" id="fTitle"></div>
    <div style="width:40px;flex:none"></div>
  </div>
  <div class="f-dots" id="fDots"></div>
  <div class="f-mid">
    <div class="f-step-n" id="fN"></div>
    <div class="f-step" id="fStep"></div>
    <div class="f-timer" id="fTimer">
      <svg viewBox="0 0 200 200"><circle class="t-bg" cx="100" cy="100" r="88"/><circle class="t-fg" id="tFg" cx="100" cy="100" r="88"/></svg>
      <div class="t-txt"><b id="tTime">5:00</b><span id="tLbl">just 5 minutes</span></div>
    </div>
    <div class="f-banner hide" id="fBanner">⏰ <b>Time's up!</b> You can stop now — that already counts.<button data-act="fdismiss">I want to keep going</button></div>
  </div>
  <div class="f-actions">
    <button class="btn big primary" data-act="fdone">Done ✓</button>
    <div class="f-row">
      <button class="btn ghost" data-act="fskip">Skip this one</button>
      <button class="btn ghost" data-act="fstop">I'm done for now</button>
    </div>
  </div>
</div>

<!-- TIDY SORT -->
<div class="sort hide" id="sort">
  <div class="f-top">
    <button class="icon-btn" data-act="sortclose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="f-title" id="sTitle">🧺 Tidy sort</div>
    <div class="s-stars" id="sStars">★★★</div>
  </div>
  <div class="s-prog"><i id="sProg"></i></div>
  <div class="s-sub" id="sSub">Drag each one into its basket — or tap it, then tap the basket.</div>
  <div class="pile" id="pile"></div>
  <div class="baskets" id="baskets"></div>
</div>

<div id="sheetHost"></div>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hide">

<script>
"use strict";
/* =========================================================
   Sprout — gentle chores, tasks & a little garden
   Single-file PWA · data stays on the device (localStorage)
   ========================================================= */

const KEY = 'sprout.v1';
const VERSION = '1.3';

/* ---------- content ---------- */
const DEFAULT_ROUTINES = [
  {id:'kitchen', icon:'🍽️', name:'Kitchen reset', steps:[
    'Put on some music or a podcast','Clear everything off one counter','Load the dishwasher (or stack dishes by the sink)','Wipe the counter you just cleared','Take out the trash if it\u2019s full']},
  {id:'living', icon:'🛋️', name:'Living room tidy', steps:[
    'Grab a basket or bag','Put everything that doesn\u2019t belong into the basket','Fold the blankets','Fluff the cushions','Walk the basket around and put things back']},
  {id:'laundry', icon:'🧺', name:'Laundry', steps:[
    'Gather dirty clothes into the basket','Start one load','Set a phone alarm for when it\u2019s finished','Hang it up or move it to the dryer','Fold just the top 5 items']},
  {id:'bath', icon:'🛁', name:'Bathroom quick clean', steps:[
    'Spray the sink and let it soak','Put away things on the counter','Wipe the sink','Wipe the mirror','Swap in a fresh hand towel']},
  {id:'bed', icon:'🛏️', name:'Bedroom reset', steps:[
    'Open the curtains','Make the bed (roughly is perfect)','Clothes go in the hamper or on a hanger','Clear the nightstand','Take cups and plates to the kitchen']},
  {id:'ten', icon:'✨', name:'10-thing pickup', steps:
    Array.from({length:10},(_,i)=>'Pick up one thing and put it where it belongs ('+(i+1)+' of 10)')}
];
const TINY = [
  'Put 5 things back where they belong','Take one cup or plate to the kitchen','Wipe one surface — any surface',
  'Throw away 3 pieces of trash','Open a window and let fresh air in','Put away one piece of laundry',
  'Clear one small spot (a chair, a corner, a shelf)','Refill your water glass and drink some','Empty one bin',
  'Tidy whatever is closest to you for 2 minutes'
];
const CROPS = {
  carrot:    {e:'🥕', name:'Carrot',     need:3, hrs:2, pts:2, unlock:0},
  lettuce:   {e:'🥬', name:'Lettuce',    need:2, hrs:2, pts:1, unlock:0},
  tomato:    {e:'🍅', name:'Tomato',     need:4, hrs:3, pts:3, unlock:3},
  strawberry:{e:'🍓', name:'Strawberry', need:5, hrs:3, pts:4, unlock:6},
  potato:    {e:'🥔', name:'Potato',     need:4, hrs:4, pts:3, unlock:10},
  sunflower: {e:'🌻', name:'Sunflower',  need:6, hrs:4, pts:5, unlock:14},
  corn:      {e:'🌽', name:'Corn',       need:6, hrs:5, pts:5, unlock:18},
  pumpkin:   {e:'🎃', name:'Pumpkin',    need:8, hrs:6, pts:8, unlock:24}
};
const SIZE_DROPS = {s:1, m:2, l:3};
const CHEERS = ['Nice!','Look at you go!','One more done 🌿','That counts!','Lovely!','Yes!','Well done!','Keep the flow 🌱'];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dkey = (d = new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseD(k); d.setDate(d.getDate()+n); return dkey(d); };
const daysUntil = k => Math.round((parseD(k) - parseD(dkey())) / 864e5);
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ---- Safe storage: updates NEVER erase her data ----
   - Same storage key forever ('sprout.v1'), so every new version reads the same data.
   - migrate() only ADDS missing fields; it never replaces what she made.
   - A copy of the last good data is kept in BAK; if the main copy is ever unreadable,
     it is kept aside (never overwritten) and the backup copy is used instead. */
const BAK = 'sprout.v1.backup';
function migrate(d){
  if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('bad data');
  const addGameRewards = d.gameRewards === undefined;
  const base = defaults();
  for (const k in base) if (d[k] === undefined || d[k] === null) d[k] = base[k];
  for (const k of ['plots','routines','tasks','rewards']) if (!Array.isArray(d[k])) d[k] = base[k];
  for (const k of ['basket','log','sortStars','sortBest']) if (typeof d[k] !== 'object' || Array.isArray(d[k])) d[k] = base[k];
  if (addGameRewards && !d.rewards.some(r => r.kind === 'time' || r.kind === 'levels')) d.rewards.push(...GAME_REWARDS());
  d.gameRewards = true;
  return d;
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if (raw){
    try { const d = migrate(JSON.parse(raw)); try { localStorage.setItem(BAK, raw); } catch(_){} return d; }
    catch(e){ try { localStorage.setItem('sprout.v1.unreadable-' + Date.now(), raw); } catch(_){} }
  }
  try { const b = localStorage.getItem(BAK); if (b) return migrate(JSON.parse(b)); } catch(e){}
  return null;
}
let S = load() || defaults();
let saveWarned = false;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ if (!saveWarned){ saveWarned = true; setTimeout(() => toast('Couldn\u2019t save — please export a backup in Settings'), 300); } }

let AC = null;
function ac(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t0, d, vol = .14, type = 'sine'){
  if (!S.sound) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(.0008, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05);
}
const SND = {
  pop:   () => { tone(660,0,.14); tone(990,.07,.18); },

  win:   () => [523,659,784,1047].forEach((f,i) => tone(f, i*.09, .35, .12)),

const fx = $('#fx'), cx = fx.getContext('2d');
let parts = [], fxRun = false;
function sizeFx(){ const d = window.devicePixelRatio || 1; fx.width = innerWidth*d; fx.height = innerHeight*d; cx.setTransform(d,0,0,d,0,0); }
sizeFx(); addEventListener('resize', sizeFx);
function confetti(x = innerWidth/2, y = innerHeight*.45, n = 70, power = 1){
  const cols = ['#EE8A45','#6E9F6A','#E9B949','#6FAED6','#E58FAE','#9CC48E'];
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, s = (2 + Math.random()*6) * power;
    parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 5*power, r:Math.random()*6.3, vr:(Math.random()-.5)*.35,
      w:6+Math.random()*7, h:4+Math.random()*4, c:cols[i % cols.length], life:80+Math.random()*50});
  }
  if (!fxRun){ fxRun = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => --p.life > 0 && p.y < innerHeight + 40);
  for (const p of parts){
    p.vy += .2; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.globalAlpha = Math.min(1, p.life/25); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.w/2, -p.h/2, p.w, p.h); cx.restore();
  }
  if (parts.length) requestAnimationFrame(fxLoop); else { fxRun = false; cx.clearRect(0,0,innerWidth,innerHeight); }
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);

function floaty(text, el){
  const r = el ? el.getBoundingClientRect() : {left:innerWidth/2, top:innerHeight/2, width:0, height:0};
  const f = document.createElement('div'); f.className = 'floaty'; f.textContent = text;
  f.style.left = (r.left + r.width/2) + 'px'; f.style.top = (r.top + r.height/2) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
}
function centerOf(el){ const r = el.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; }

/* =========================================================
   FOCUS MODE
   ========================================================= */
let F = null, fTick = null;
const CIRC = 2 * Math.PI * 88;
function startFocus(title, steps, isRoutine){
  ac();
  F = {title, steps, isRoutine, i:0, done:0, earned:0, start:Date.now(), dur:S.timer, rang:false};
  $('#fTitle').textContent = title;
  $('#fBanner').classList.add('hide');
  $('#fTimer').classList.toggle('hide', false);
  $('#focus').classList.remove('hide');
  document.body.style.overflow = 'hidden';
  showStep(); tickFocus();
  clearInterval(fTick); fTick = setInterval(tickFocus, 500);
}
function showStep(){
  const n = F.steps.length;
  $('#fN').textContent = n > 1 ? 'Step ' + (F.i+1) + ' of ' + n : 'Just this one';
  const st = $('#fStep'); st.textContent = F.steps[F.i];
  st.classList.remove('in'); void st.offsetWidth; st.classList.add('in');
  $('#fDots').innerHTML = n > 1 ? F.steps.map((_,k) => `<i class="${k < F.i ? 'd' : k === F.i ? 'c' : ''}"></i>`).join('') : '';
}
function tickFocus(){
  if (!F) return;
  const el = (Date.now() - F.start) / 1000, fg = $('#tFg');
  const fmt = s => Math.floor(s/60) + ':' + pad(Math.floor(s % 60));
  if (!F.dur){
    $('#tTime').textContent = fmt(el); $('#tLbl').textContent = 'no rush';
    fg.style.strokeDashoffset = 0; fg.classList.add('over'); return;
  }
  const rem = F.dur - el;
  if (rem > 0){
    $('#tTime').textContent = fmt(Math.ceil(rem));
    $('#tLbl').textContent = 'just ' + Math.round(F.dur/60) + ' minutes';
    fg.style.strokeDashoffset = CIRC * (1 - rem / F.dur); fg.classList.remove('over');
  } else {
    $('#tTime').textContent = '+' + fmt(-rem); $('#tLbl').textContent = 'bonus time ✨';
    fg.style.strokeDashoffset = 0; fg.classList.add('over');
    if (!F.rang){ F.rang = true; SND.chime(); $('#fBanner').classList.remove('hide'); confetti(innerWidth/2, innerHeight*.4, 40, .8); }
  }
}
function focusDone(btn){
  F.done++; F.earned++; earn(1); logActivity(1); save();
  SND.pop(); const [x,y] = centerOf(btn); confetti(x, y, 26, .7); floaty('+1 💧', btn);
  F.i++;
  if (F.i >= F.steps.length) finishFocus(true);
  else { showStep(); if (F.done % 2 === 0) toast(pick(CHEERS)); }
}
function focusSkip(){
  F.i++;
  if (F.i >= F.steps.length) finishFocus(false); else showStep();
}
function finishFocus(completed){
  clearInterval(fTick);
  const f = F; F = null;
  $('#focus').classList.add('hide'); document.body.style.overflow = '';
  let bonus = 0;
  if (completed && f.isRoutine && f.steps.length >= 3 && f.done === f.steps.length){ bonus = 3; earn(3); }
  const total = f.earned + bonus; save();
  let em, h, p;
  if (f.done && f.done === f.steps.length){ em = '🎉'; h = 'All done!'; p = 'You finished every step. That\u2019s a real win.'; }
  else if (f.done){ em = '🌿'; h = 'Nice work'; p = 'You did ' + f.done + (f.done === 1 ? ' step' : ' steps') + '. Every step counts — stopping is allowed.'; }
  else { em = '💛'; h = 'That\u2019s okay'; p = 'Starting is the hardest part. Maybe try one tiny thing later?'; }
  openSheet(`
    <div class="done-hero"><span class="em">${em}</span><h3>${h}</h3><p>${p}</p></div>
    ${total ? `<div class="card" style="text-align:center;font-size:18px;font-weight:600">+${total} 💧 water${bonus ? `<div class="muted small" style="font-weight:500;margin-top:4px">including +${bonus} bonus for finishing</div>` : ''}</div>` : ''}
    ${total ? `<button class="btn primary full" data-act="togarden">🌱 Water my garden</button>` : ''}
    ${f.done ? `<button class="btn full" data-act="sortplay" style="margin-top:8px">🧺 Take a calm sorting break</button>` : ''}
    <button class="btn ghost full" data-act="closesheet" style="margin-top:6px">Close</button>`);
  if (f.done){ SND.win(); confetti(innerWidth/2, innerHeight*.55, f.done === f.steps.length ? 120 : 60, 1.1); }
  render();
}

/* =========================================================
   TIDY SORT — sorting mini-game with levels
   Levels cycle through 3 kinds of puzzle and get harder each round:
     Match  — same item to same basket (look-alikes from level 4)
     Colors — sort by colour (baskets show only a colour)
     Market — fruit / veggies / bakery
   Messier, overlapping piles; more baskets and items. Never a fail state:
   mistakes only cost a star.
   ========================================================= */
const SORT_MODES = {match:'Match', color:'Colors', family:'Market'};
const SORT_HINT = {match:'Put each one in its matching basket.', color:'Sort everything by colour.', family:'Fruit, veggies or bakery?'};
const EXTRA_SORT = ['🍎','🍐','🍋','🫐','🍇','🍊','🥒','🧅'];
const LOOKALIKE = [['🍎','🍅','🍒'],['🍏','🍐','🥝'],['🍊','🍑','🥭'],['🍋','🍌','🌽'],['🥒','🥬','🥦','🫑'],['🍇','🫐','🍆'],['🥔','🧅','🧄']];
const COLORS = [
  {id:'red',    name:'Red',    c:'#E5534B', items:['🍎','🍓','🍒','🌶️','🍅']},
  {id:'orange', name:'Orange', c:'#F0913A', items:['🥕','🍊','🎃','🍑','🥭']},
  {id:'yellow', name:'Yellow', c:'#F2C94C', items:['🍋','🍌','🌽','🍍']},
  {id:'green',  name:'Green',  c:'#6FB35F', items:['🥦','🥒','🥬','🍏','🫑','🥝']},
  {id:'purple', name:'Purple', c:'#8E6CC7', items:['🍇','🍆']},
  {id:'brown',  name:'Brown',  c:'#9C7250', items:['🥔','🌰','🥜','🥥']}
];
const FAMILY = [
  {id:'fruit', name:'Fruit',   e:'🍎', items:['🍎','🍐','🍊','🍋','🍌','🍇','🍓','🍒','🍑','🍍','🥝','🫐','🍏','🥭']},
  {id:'veg',   name:'Veggies', e:'🥕', items:['🥕','🥦','🥬','🥔','🌽','🧅','🫑','🥒','🍆','🧄']},
  {id:'bake',  name:'Bakery',  e:'🥐', items:['🍞','🥐','🥖','🥨','🥯','🧇']}
];
const SCALE = [523,587,659,784,880,1047,1175,1319,1568,1760];
const mix = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
let SG = null;

function levelMode(L){ return ['match','color','family'][(L-1) % 3]; }
function sortPool(){
  const unlocked = Object.values(CROPS).filter(c => S.harvests >= c.unlock).map(c => c.e);
  return [...new Set([...mix(unlocked), ...mix(EXTRA_SORT)])];
}
function levelConfig(L){
  const mode = levelMode(L), tier = Math.floor((L-1) / 3);
  const baskets = [], items = [];
  if (mode === 'match'){
    const kinds = Math.min(6, 4 + tier), per = Math.min(5, 3 + tier);
    let pool = [];
    if (tier >= 1){ for (const g of mix(LOOKALIKE)){ for (const e of mix(g)) if (pool.length < kinds) pool.push(e); if (pool.length >= kinds) break; } }
    else pool = sortPool().slice(0, kinds);
    pool.forEach(e => { baskets.push({k:e, label:e}); for (let i = 0; i < per; i++) items.push({k:e, e}); });
  } else if (mode === 'color'){
    const n = Math.min(6, 3 + tier), per = Math.min(6, 4 + tier);
    mix(COLORS).slice(0, n).forEach(c => { baskets.push({k:c.id, swatch:c.c}); for (let i = 0; i < per; i++) items.push({k:c.id, e:pick(c.items)}); });
  } else {
    const fams = tier >= 1 ? FAMILY : FAMILY.slice(0, 2), total = Math.min(30, 12 + tier * 4);
    fams.forEach(f => baskets.push({k:f.id, label:f.e, name:f.name}));
    for (let i = 0; i < total; i++){ const f = fams[i % fams.length]; items.push({k:f.id, e:pick(f.items)}); }
  }
  return {mode, tier, baskets: mode === 'match' ? mix(baskets) : baskets, items: mix(items), messy: L >= 2};
}
function starsFor(miss){ return miss === 0 ? 3 : miss <= 2 ? 2 : 1; }
function starsHTML(n){ return '★'.repeat(n) + `<span class="off">${'★'.repeat(3 - n)}</span>`; }
function fmtSecs(t){ return Math.floor(t/60) + ':' + pad(Math.round(t % 60)); }

function startSort(L){
  ac();
  L = Math.max(1, Math.min(L || S.sortLevel, S.sortLevel));
  const cfg = levelConfig(L);
  SG = {L, cfg, items: cfg.items.map(x => ({...x, id:uid()})), total:cfg.items.length, left:cfg.items.length,
        streak:0, sel:null, counts:{}, miss:0, start:Date.now(), sz: cfg.items.length > 16 ? 54 : 64};
  $('#sTitle').textContent = 'Level ' + L + ' · ' + SORT_MODES[cfg.mode];
  $('#sStars').innerHTML = starsHTML(3);
  $('#sort').classList.remove('hide');
  document.body.style.overflow = 'hidden';
  const bk = $('#baskets'), n = cfg.baskets.length;
  bk.style.setProperty('--cols', n > 4 ? 3 : n);
  bk.classList.toggle('many', n > 4);
  bk.innerHTML = cfg.baskets.map(b => `<button class="basket-t" data-k="${b.k}"><span class="n hide">0</span>${
      b.swatch ? `<span class="sw" style="background:${b.swatch}"></span>` : `<span class="tag">${b.label}</span>`}${
      b.name ? `<span class="nm">${b.name}</span>` : '<span class="bk">🧺</span>'}</button>`).join('');
  $('#sSub').textContent = SORT_HINT[cfg.mode] + (L === 1 ? ' Drag, or tap then tap the basket.' : '');
  $('#sProg').style.width = '0%';
  requestAnimationFrame(layoutPile);
}
function layoutPile(){
  const pile = $('#pile'), r = pile.getBoundingClientRect(), n = SG.items.length, sz = SG.sz, half = sz / 2;
  pile.innerHTML = '';
  let spots;
  if (!SG.cfg.messy){
    const cols = r.width > 420 ? 5 : 4, rows = Math.ceil(n / cols);
    const cw = r.width / cols, rh = Math.min(r.height / rows, 110), top0 = (r.height - rh * rows) / 2;
    spots = mix(Array.from({length: cols * rows}, (_, i) => i)).slice(0, n).map(c => [
      (c % cols) * cw + cw/2 + (Math.random() - .5) * Math.max(0, cw - sz - 6),
      top0 + Math.floor(c / cols) * rh + rh/2 + (Math.random() - .5) * Math.max(0, rh - sz - 6)]);
  } else {
    // a real messy pile: items overlap, the ones on top hide the ones below
    const padX = half + 6, padY = half + 6;
    spots = Array.from({length:n}, () => [padX + Math.random() * (r.width - padX*2), padY + Math.random() * (r.height - padY*2)]);
  }
  SG.items.forEach((it, i) => {
    const [x, y] = spots[i], el = document.createElement('div');
    el.className = 'sitem'; el.textContent = it.e; el.dataset.id = it.id;
    el.style.width = el.style.height = sz + 'px'; el.style.fontSize = Math.round(sz * .69) + 'px';
    el.style.left = (x - half) + 'px'; el.style.top = (y - half) + 'px';
    const rot = SG.cfg.messy ? (Math.random() - .5) * 70 : (Math.random() - .5) * 24;
    el.style.transform = el.dataset.rot = 'rotate(' + Math.round(rot) + 'deg)';
    el.style.animationDelay = Math.min(i * 30, 600) + 'ms';
    pile.appendChild(el); it.el = el;
    bindDrag(el, it);
  });
}
function basketAt(x, y){
  for (const b of document.querySelectorAll('.basket-t')){
    const r = b.getBoundingClientRect();
    if (x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 20 && y <= r.bottom + 6) return b;
  }
  return null;
}
function bindDrag(el, it){
  let sx = 0, sy = 0, moved = false, active = false, hot = null;
  el.addEventListener('pointerdown', e => {
    if (!SG || it.gone) return;
    e.preventDefault(); ac();
    active = true; moved = false; sx = e.clientX; sy = e.clientY;
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    el.classList.add('drag');
  });
  el.addEventListener('pointermove', e => {
    if (!active) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.hypot(dx, dy) > 6){ moved = true; clearSel(); el.parentNode.appendChild(el); }
    if (!moved) return;
    el.style.transform = `translate(${dx}px,${dy}px) scale(1.18)`;
    const b = basketAt(e.clientX, e.clientY);
    if (b !== hot){ hot && hot.classList.remove('hot'); hot = b; hot && hot.classList.add('hot'); }
  });
  const up = e => {
    if (!active) return; active = false;
    el.classList.remove('drag'); hot && hot.classList.remove('hot'); hot = null;
    if (!SG) return;
    if (!moved){ el.style.transform = el.dataset.rot; toggleSel(it); return; }
    const b = basketAt(e.clientX, e.clientY);
    if (b) tryDrop(it, b); else el.style.transform = el.dataset.rot;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}
function clearSel(){ if (SG && SG.sel){ SG.sel.el.classList.remove('sel'); SG.sel = null; } }
function toggleSel(it){
  if (SG.sel === it){ clearSel(); return; }
  clearSel(); SG.sel = it; it.el.classList.add('sel'); tone(660, 0, .08, .06);
}
function tryDrop(it, b){
  if (b.dataset.k === it.k){
    it.gone = true; clearSel();
    const br = b.getBoundingClientRect(), pr = $('#pile').getBoundingClientRect(), half = SG.sz / 2;
    const dx = (br.left + br.width/2) - (pr.left + parseFloat(it.el.style.left) + half);
    const dy = (br.top + br.height/2) - (pr.top + parseFloat(it.el.style.top) + half);
    const el = it.el; el.style.transform = `translate(${dx}px,${dy}px) scale(.35)`; el.style.opacity = '0';
    setTimeout(() => el.remove(), 340);
    tone(SCALE[Math.min(SG.streak, SCALE.length - 1)], 0, .22, .12); SG.streak++;
    b.classList.remove('yum'); void b.offsetWidth; b.classList.add('yum');
    SG.counts[it.k] = (SG.counts[it.k] || 0) + 1;
    const nEl = b.querySelector('.n'); nEl.textContent = SG.counts[it.k]; nEl.classList.remove('hide');
    SG.left--;
    $('#sProg').style.width = Math.round((1 - SG.left / SG.total) * 100) + '%';
    if (SG.streak % 5 === 0){ const [x,y] = centerOf(b); confetti(x, y, 18, .6); }
    if (!SG.left) setTimeout(sortWin, 420);
  } else {
    SG.streak = 0; SG.miss++; tone(330, 0, .14, .06, 'triangle');
    $('#sStars').innerHTML = starsHTML(starsFor(SG.miss));
    b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope');
    it.el.style.transform = it.el.dataset.rot;
  }
}
document.addEventListener('click', e => {
  if (!SG || !SG.sel) return;
  const b = e.target.closest('.basket-t'); if (b) tryDrop(SG.sel, b);
});
function sortWin(){
  if (!SG) return;
  const g = SG, L = g.L, secs = (Date.now() - g.start) / 1000, stars = starsFor(g.miss);
  const prevStars = S.sortStars[L] || 0, prevBest = S.sortBest[L];
  const newBest = prevBest === undefined || secs < prevBest;
  S.sorts = (S.sorts || 0) + 1;
  S.sortStars[L] = Math.max(prevStars, stars);
  if (newBest) S.sortBest[L] = Math.round(secs);
  const unlocked = L === S.sortLevel; if (unlocked) S.sortLevel = L + 1;
  let gift = false, starBonus = false;
  if (S.sortDay !== dkey()){ S.sortDay = dkey(); S.drops += 1; gift = true; }
  if (stars === 3 && prevStars < 3){ S.points += 1; starBonus = true; }
  save(); SND.win(); confetti(innerWidth/2, innerHeight*.45, 60 + stars * 30, 1.1);
  $('#sSub').textContent = 'All tidy ✨';
  setTimeout(() => {
    endSort(true);
    const next = L + 1;
    openSheet(`
      <div class="done-hero"><h3 style="margin-top:4px">Level ${L} done!</h3>
        <div class="win-stars">${starsHTML(stars)}</div>
        <p>${stars === 3 ? 'Perfect — not a single slip!' : g.miss + (g.miss === 1 ? ' slip' : ' slips') + '. Try again for 3 stars?'}<br>
        Time ${fmtSecs(secs)}${newBest && prevBest !== undefined ? ' · <b>new best!</b> 🏅' : prevBest !== undefined ? ' · best ' + fmtSecs(prevBest) : ''}</p></div>
      ${gift || starBonus ? `<div class="card" style="text-align:center;font-size:16px;font-weight:600">${[gift ? '+1 💧 first round today' : '', starBonus ? '+1 ⭐ for 3 stars' : ''].filter(Boolean).join(' · ')}</div>` : ''}
      ${unlocked ? `<div class="muted small" style="text-align:center;margin-bottom:10px">Unlocked: Level ${next} · ${SORT_MODES[levelMode(next)]}</div>` : ''}
      <button class="btn primary full" data-act="sortnext" data-l="${Math.min(next, S.sortLevel)}">Next level →</button>
      <div class="row" style="margin-top:8px">
        <button class="btn" data-act="sortagain" data-l="${L}">Replay</button>
        <button class="btn ghost" data-act="sortback">Back to my day</button>
      </div>`);
  }, 700);
}
function levelSheet(){
  const max = S.sortLevel, out = [];
  for (let L = 1; L <= max; L++){
    const st = S.sortStars[L] || 0, m = levelMode(L);
    out.push(`<button class="lv ${L === max ? 'cur' : ''}" data-act="sortpick" data-l="${L}"><b>${L}</b><i>${SORT_MODES[m]}</i><span>${L === max && !st ? 'new' : '★'.repeat(st) || '·'}</span></button>`);
  }
  openSheet(`
    <h3>Tidy sort levels</h3>
    <p>Each level gets a little trickier. Replay any level to chase 3 stars or a faster time.</p>
    <div class="lv-grid">${out.join('')}</div>
    <button class="btn ghost full" data-act="closesheet">Close</button>`);
}
function endSort(keep){
  SG = null; $('#sort').classList.add('hide'); $('#pile').innerHTML = '';
  document.body.style.overflow = '';
  if (!keep) render();
}

/* =========================================================
   GAME-TIME REWARDS — play another game, but only for a set time / levels
   The session is saved, so the timer keeps counting while she is in the
   other app; when she comes back after the time is up, Sprout tells her.
   ========================================================= */
function rewardDesc(r){ return r.kind === 'time' ? r.amount + ' minutes, with a timer' : r.amount + ' levels, then stop'; }
function sessRemaining(){ const s = S.session; return s && s.kind === 'time' && s.start ? s.start + s.amount * 60e3 - Date.now() : null; }
function clockAt(ms){ return new Date(ms).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'}); }
function sessionLine(){
  const s = S.session; if (!s) return '';
  if (s.kind === 'levels') return s.done + ' of ' + s.amount + ' levels played';
  if (!s.start) return 'Start the timer when you open your game';
  const rem = sessRemaining();
  return rem > 0 ? fmtSecs(Math.ceil(rem / 1000)) + ' left · until ' + clockAt(s.start + s.amount * 60e3) : 'Time\u2019s up';
}
function sessionSheet(){
  const s = S.session; if (!s) return;
  let body;
  if (s.kind === 'time' && !s.start){
    body = `<p>You earned <b>${s.amount} minutes</b>. Start the timer right when you open your game.</p>
      <button class="btn primary big" data-act="sessstart">▶ Start ${s.amount}-minute timer</button>`;
  } else if (s.kind === 'time'){
    const end = s.start + s.amount * 60e3;
    body = `<div style="text-align:center;margin:6px 0 14px"><div id="sesT" style="font-size:56px;font-weight:700;font-variant-numeric:tabular-nums">${fmtSecs(Math.max(0, Math.ceil(sessRemaining() / 1000)))}</div>
      <div class="muted">Play until <b>${clockAt(end)}</b></div></div>
      <p class="small">Switch to your game now. When the time is up, come back here 💛<br>Tip: also set a ${s.amount}-minute timer in the Clock app — it rings even when Sprout is closed.</p>`;
  } else {
    body = `<p>Play <b>${s.amount} ${s.amount === 1 ? 'level' : 'levels'}</b> — then stop. Tap the button after each level.</p>
      <div style="text-align:center;font-size:44px;font-weight:700;margin:4px 0 14px">${s.done} <span class="muted" style="font-size:24px">of ${s.amount}</span></div>
      <button class="btn primary big" data-act="sesslevel">Level done ✓</button>`;
  }
  openSheet(`<h3>${esc(s.name)}</h3>${body}
    <button class="btn ghost full" data-act="sessearly" style="margin-top:8px">I'm done${s.kind === 'time' && !s.start ? '' : ' early'}</button>
    <button class="btn ghost full" data-act="closesheet">Hide</button>`);
}
function sessionEnd(){
  const s = S.session; if (!s) return;
  S.session = null; save(); SND.chime(); confetti(innerWidth/2, innerHeight*.45, 80, 1);
  openSheet(`<div class="done-hero"><span class="em">${s.kind === 'time' ? '⏰' : '🎉'}</span>
    <h3>${s.kind === 'time' ? 'Game time\u2019s up' : 'That\u2019s your ' + s.amount + ' levels!'}</h3>
    <p>Well played. Time to put the game down — you earned that and stopped right on time 💛</p></div>
    <button class="btn primary full" data-act="closesheet">Back to my day</button>`);
  render();
}
function sessTick(){
  const s = S.session; if (!s || s.kind !== 'time' || !s.start) return;
  const rem = sessRemaining(), t = $('#sesT'), c = $('#sesLine');
  if (t) t.textContent = fmtSecs(Math.max(0, Math.ceil(rem / 1000)));
  if (c) c.textContent = sessionLine();
  if (rem <= 0 && !s.alerted){ s.alerted = true; save(); sessionEnd(); }
}
setInterval(sessTick, 1000);

  settings: settingsSheet,

  pickchore: () => { const r = pick(S.routines); if (r) startFocus(r.icon + ' ' + r.name, r.steps, true); },
  tiny: () => startFocus('🤏 One tiny thing', [pick(TINY)], false),
  startroutine: b => { const r = S.routines.find(x => x.id === b.dataset.id); if (r && r.steps.length) startFocus(r.icon + ' ' + r.name, r.steps, true); },
  timer: b => { S.timer = +b.dataset.v; save(); renderChores(); },
  editroutine: b => routineSheet(b.dataset.id),
  saveroutine: b => {

  },
  delroutine: b => {
    if (!confirm('Delete this routine?')) return;
    S.routines = S.routines.filter(x => x.id !== b.dataset.id); save(); closeSheet(); render();
  },

  fdone: b => focusDone(b),
  fskip: () => focusSkip(),
  fstop: () => finishFocus(false),
  fdismiss: () => $('#fBanner').classList.add('hide'),
  togarden: () => { closeSheet(); go('garden'); },
  sortplay: () => { closeSheet(); startSort(S.sortLevel); },
  sortclose: () => endSort(),
  sortagain: b => { closeSheet(); startSort(+b.dataset.l || S.sortLevel); },

  newsize: b => { S.newSize = b.dataset.v; save(); document.querySelectorAll('.sz button').forEach(x => x.classList.toggle('on', x === b)); },
  donetask: b => completeTask(b.dataset.id, b),
  undotask: b => { const t = S.tasks.find(x => x.id === b.dataset.id); if (t){ t.done = false; save(); render(); } },
  totoday: b => { const t = S.tasks.find(x => x.id === b.dataset.id); if (t){ t.due = dkey(); save(); render(); toast('Moved to today — fresh start 💛'); } },
  edittask: b => taskSheet(b.dataset.id),
  esize: b => { b.closest('.sheet').dataset.size = b.dataset.v; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); },
  savetask: b => {
    const t = S.tasks.find(x => x.id === b.dataset.id); if (!t) return;

    save(); closeSheet(); render();
  },
  tomorrow: b => { const t = S.tasks.find(x => x.id === b.dataset.id); if (t){ t.due = addDays(dkey(), 1); save(); closeSheet(); render(); toast('Moved to tomorrow'); } },
  ics: b => { const t = S.tasks.find(x => x.id === b.dataset.id); if (t && t.due) exportICS(t); },
  deltask: b => { S.tasks = S.tasks.filter(x => x.id !== b.dataset.id); save(); closeSheet(); render(); },
  cleardone: () => { S.tasks = S.tasks.filter(t => !t.done); save(); render(); },

  plant: b => plantSheet(+b.dataset.i),
  lockedcrop: b => toast('Unlocks after ' + b.dataset.u + ' harvests 🔒'),
  doplant: b => {
    const i = +b.dataset.i; S.plots[i] = {c:b.dataset.k, w:0, t:Date.now()}; save(); closeSheet(); SND.pop(); render();
    toast(CROPS[b.dataset.k].e + ' planted!');
  },
  water: b => {
    const p = S.plots[+b.dataset.i]; if (!p) return;
    if (S.drops < 1){ toast('No water yet — finish a chore step to earn 💧'); return; }
    S.drops--; p.w++; save(); SND.water(); floaty('💧', b);
    const ready = prog(p) >= CROPS[p.c].need;
    render();
    const nb = document.querySelector(`.plot[data-i="${b.dataset.i}"]`);
    if (nb){ nb.classList.add('splash'); }
    if (ready) toast(CROPS[p.c].e + ' is ready to pick!');
  },
  harvest: b => {
    const i = +b.dataset.i, p = S.plots[i]; if (!p) return;
    const c = CROPS[p.c], before = S.harvests, plotsBefore = plotCount();
    S.basket[p.c] = (S.basket[p.c] || 0) + 1; S.harvests++; S.points += c.pts; S.plots[i] = null;
    save(); SND.harvest(); const [x,y] = centerOf(b); confetti(x, y, 60, 1); floaty(c.e + ' +' + c.pts + '⭐', b);
    const unlocked = Object.values(CROPS).find(k => k.unlock > before && k.unlock <= S.harvests);
    setTimeout(() => {
      if (unlocked) toast('New seed unlocked: ' + unlocked.e + ' ' + unlocked.name + '!');
      else if (plotCount() > plotsBefore) toast('Your garden grew — 3 new beds! 🌱');
    }, 600);
    render();
  },
  redeem: b => {
    const r = S.rewards.find(x => x.id === b.dataset.id); if (!r || S.points < r.cost) return;
    if ((r.kind === 'time' || r.kind === 'levels') && S.session){ toast('Finish your current game reward first 🎮'); sessionSheet(); return; }
    S.points -= r.cost; SND.win(); confetti(innerWidth/2, innerHeight*.5, 120, 1.2);
    if (r.kind === 'time' || r.kind === 'levels'){
      S.session = {name:r.name, kind:r.kind, amount:r.amount, start:0, done:0, alerted:false}; save(); render(); sessionSheet();

    if (kind !== 'treat'){ r.kind = kind; r.amount = Math.max(1, Math.min(kind === 'time' ? 120 : 20, parseInt($('#rwAmt').value, 10) || 1)); }
    S.rewards.push(r); save(); closeSheet(); render();
  },
  sessopen: () => sessionSheet(),
  sessstart: () => { const s = S.session; if (!s) return; s.start = Date.now(); s.alerted = false; save(); SND.pop(); sessionSheet(); render(); },
  sesslevel: b => {
    const s = S.session; if (!s) return; s.done++; save();
    tone(SCALE[Math.min(s.done, SCALE.length - 1)], 0, .25, .12);
    if (s.done >= s.amount) sessionEnd(); else { const [x,y] = centerOf(b); confetti(x, y, 20, .6); sessionSheet(); render(); }
  },
  sessearly: () => { S.session = null; save(); closeSheet(); render(); toast('Stopping early — great self-control 💛'); },
  delreward: b => { if (!confirm('Remove this reward?')) return; S.rewards = S.rewards.filter(x => x.id !== b.dataset.id); save(); render(); },

  togglesound: b => { S.sound = !S.sound; save(); b.classList.toggle('on', S.sound); if (S.sound) SND.pop(); },
  export: async () => {
    S.lastExport = dkey(); save();
    const name = 'sprout-backup-' + dkey() + '.json', text = JSON.stringify(S, null, 1);
    // On iPhone this opens the share sheet → "Save to Files" → iCloud Drive
    try {
      const file = new File([text], name, {type:'application/json'});
      if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Sprout backup'}); toast('Backup saved 💾'); return; }
    } catch(e){ if (e && e.name === 'AbortError') return; }
    downloadFile(name, text, 'application/json');
  },
  checkupdate: () => checkUpdate(true),
  doupdate: () => doUpdate(),
  import: () => $('#importFile').click(),
  reset: () => {
    if (!confirm('Start fresh? This deletes all tasks, routines and your garden.')) return;
    if (!confirm('Are you sure? Maybe export a backup first.')) return;
    S = defaults(); S.lastGift = dkey(); save(); closeSheet(); go('today');
  }
};

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab && !e.target.closest('[data-act]')){ go(tab.dataset.tab); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b, e);
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.plots)) throw 0;
      S = Object.assign(defaults(), d); save(); closeSheet(); go('today'); toast('Backup restored 🌿');
    } catch(err){ toast('That file doesn\u2019t look like a Sprout backup'); }
    e.target.value = '';
  };
  rd.readAsText(f);
});
document.addEventListener('touchstart', () => ac(), {once:true, passive:true});

/* ---------- updates ----------
   Checks the online copy for a newer VERSION. Updating only reloads the app code;
   her data lives in this phone's storage and is untouched. */
let UPDATE = '', lastCheck = 0;
function newer(a, b){ const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++){ if ((x[i]||0) !== (y[i]||0)) return (x[i]||0) > (y[i]||0); } return false; }
async function checkUpdate(manual){
  if (location.protocol !== 'https:'){ if (manual) toast('Updates work when the app is opened from its web link'); return; }
  lastCheck = Date.now();
  try {
    const r = await fetch(location.pathname.replace(/[^/]*$/, '') + 'index.html', {cache:'reload'});
    const m = (await r.text()).match(/const VERSION = '([\d.]+)'/);
    if (m && newer(m[1], VERSION)){
      UPDATE = m[1];
      if (manual){ toast('Version ' + UPDATE + ' is ready ✨'); }
      if (!F && !SG) render();
      if ($('#sheetHost').innerHTML && manual) settingsSheet();
    } else if (manual) toast('You have the newest version ✓');
  } catch(e){ if (manual) toast('No internet right now — try again later'); }
}
async function doUpdate(){
  save();
  try { localStorage.setItem(BAK, JSON.stringify(S)); } catch(e){}
  toast('Updating… 🌱');
  try {
    if (navigator.serviceWorker){ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.update())); }
    if (window.caches){ const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
  } catch(e){}
  setTimeout(() => location.reload(), 400);
}

/* ---------- daily gift & refresh ---------- */
function dailyGift(){
  const k = dkey();
  if (S.lastGift === k) return;
  const first = !S.lastGift; S.lastGift = k;
  if (!first){ S.drops += 2; save(); setTimeout(() => toast('Good to see you! +2 💧 for today'), 600); }
  else save();
}
setInterval(() => { if (!F && !$('#sheetHost').innerHTML && (TAB === 'garden' || TAB === 'today')) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ dailyGift(); if (Date.now() - lastCheck > 36e5) checkUpdate(false); sessTick(); if (!F && !SG) render(); else if (F) tickFocus(); } });
